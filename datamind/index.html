<!DOCTYPE html>
<html lang="zh-CN" data-theme-color="indigo" data-theme="light" data-density="comfortable" data-radius="medium">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datamind</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />


  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/font/iconfont.css" />
  <link rel="stylesheet" href="../assets/css/sections.css" />

  <!-- 路由过渡 -->
  <style>
    .fade-enter-active, .fade-leave-active { transition: opacity 180ms ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>

  <!-- 防首屏闪烁 -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('design.settings.v1');
        var s = raw ? JSON.parse(raw) : {};
        var root = document.documentElement;
        if (s.themeColor) root.setAttribute('data-theme-color', s.themeColor);
        if (s.colorMode)  root.setAttribute('data-theme', s.colorMode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : s.colorMode);
        if (s.density)    root.setAttribute('data-density', s.density);
        if (s.radius)     root.setAttribute('data-radius', s.radius);
        if (s.locale)     root.setAttribute('lang', s.locale);
      } catch (e) { /* 忽略 */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- ============================================================
       JS 依赖顺序（严格按此）：
       Vue → Vue Router → i18n → settings → routes →
       components/index.js（内含组件清单，自动按序加载 base/layout/panels/views）
       → 应用启动
  ============================================================ -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/settings.js"></script>
  <script src="../assets/js/routes.js"></script>
  <!-- 一个文件引入全部共享组件（清单见 components/index.js 的 MANIFEST） -->
  <script src="../components/index.js?v=9"></script>
  <!-- 本项目专属视图（清单见 datamind/views.js，不与其他项目共用） -->
  <script src="./views.js?v=3"></script>

  <!-- ============ 应用启动 ============ -->
  <script>
    (function () {
      'use strict';
      const { createApp, computed, ref } = window.Vue;
      const { createRouter, createWebHashHistory } = window.VueRouter;

      /* 0. 基础配置 */
      const appConfig = {
        system: { logo: '../assets/logo.svg', name: 'Datamind' },
        layout:{
          layout: 'sideLayout',
          header: {
              mode: 'inherit',// dark, light, inherit
              size: 'medium',// small, medium, large, 48px
              showLogo: true,
              actions: true,
              flexBox: 'breadcrumb' // breadcrumb, menu, tabbar
          },
          sidebar: {
              mode: 'inherit',// dark, light, inherit
              size: 'medium',// small, medium, large, 48px
              showLogo: true,
              actions: true,
              guide: 'menu' // menu, tabbar
          },
          pages:{
              breadcrumb: false,
              tabbar: false,
              title: true,
          }
        }
      };

      /* 1. 设置 & i18n */
      const settings = window.Settings.create();
      const state = settings.state;
      const resolvedMode = settings.resolvedMode;
      const dict = computed(() => window.I18N[state.locale] || window.I18N['zh-CN']);
      const t = (key) => key.split('.').reduce((acc, k) => (acc ? acc[k] : ''), dict.value);

      /* 2. 本页菜单 + 路由配置（Hash 模式）
       *    componentKey 对应 views/ 中自注册的视图组件名
       *    所有 path 用绝对路径；有 children 的项自动转为嵌套路由 */
      const menuRoutes = [
        { key: 'home',   path: '/home',         label: 'nav.home',    icon: 'Home',    componentKey: 'HomeView' },
        { key: 'about',  path: '/about',        label: 'nav.about',   icon: 'Compass',   componentKey: 'AboutView' },
        {
          key: 'system',
          path: '/system',
          label: 'nav.system',
          icon: 'DeviceMonitor',
          children: [
            { key: 'system-users', path: '/system/users', label: 'nav.systemUsers', icon: 'PersonSales',     componentKey: 'SystemUsersView' },
            { key: 'system-roles', path: '/system/roles', label: 'nav.systemRoles', icon: 'UserInfo', componentKey: 'SystemRolesView' },
          ],
        },
        { key: 'appsettings',  path: '/appsettings',        label: 'nav.appSettings',   icon: 'Setting',   componentKey: 'AppSettingsView' },
        { key: 'user-center',  path: '/user-center',        label: 'nav.userCenter',    icon: 'UserInfo',  componentKey: 'UserCenterView' },
      ];
      const router = createRouter({
        history: createWebHashHistory(),
        routes: window.Routes.buildRoutes(menuRoutes),
      });

      /* 3. 创建应用 */
      const app = createApp({
        setup() {
          const collapsed = ref(false);
          const toggleCollapse = () => { collapsed.value = !collapsed.value; };

          return {
            state,
            resolvedMode,
            t,
            enums: settings.enums,
            collapsed,
            toggleCollapse,
            menuItems: menuRoutes,
            // logo: { src: '../assets/logo.svg', name: 'Datamind' },
            appConfig,
          };
        },

        template: `
          <app-layout
            :menu-items="menuItems"
            :collapsed="collapsed"
            @update:collapsed="collapsed = $event"
            :t="t"
            :config="appConfig"
          >
            <template #header-actions>
              <!-- 用户头像 -->
              <x-dropdown placement="bottom-end" trigger="hover" :close-on-click="false">
                <div class="header-user" role="button" aria-label="用户设置">U</div>
                <template #menu>
                  <user-setting :t="t" />
                </template>
              </x-dropdown>
            </template>
          </app-layout>
        `,
      });

      /* 4. 全局注册 + 注入 */
      window.registerComponents(app);
      app.provide('settings', settings);
      app.provide('t', t);
      app.config.globalProperties.t = t; // 给 Breadcrumb 的 $root.t 用

      /* 5. 挂载 */
      app.use(router);
      app.mount('#app');
    })();
  </script>
</body>
</html>
