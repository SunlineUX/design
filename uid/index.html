<!DOCTYPE html>
<html lang="zh-CN" data-theme-color="indigo" data-theme="light" data-density="comfortable" data-radius="medium">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UID</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo/logo2.png" />


  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/font/iconfont.css" />
  <link rel="stylesheet" href="../assets/css/sections.css" />

  <!-- 路由过渡 -->
  <style>
    .fade-enter-active, .fade-leave-active { transition: opacity 180ms ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>

  <!-- 防首屏闪烁 -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('design.settings.v1');
        var s = raw ? JSON.parse(raw) : {};
        var root = document.documentElement;
        if (s.themeColor) root.setAttribute('data-theme-color', s.themeColor);
        if (s.colorMode)  root.setAttribute('data-theme', s.colorMode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : s.colorMode);
        if (s.density)    root.setAttribute('data-density', s.density);
        if (s.radius)     root.setAttribute('data-radius', s.radius);
        if (s.locale)     root.setAttribute('lang', s.locale);
      } catch (e) { /* 忽略 */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- ============================================================
       JS 依赖顺序（严格按此）：
       Vue → Vue Router → i18n → settings → routes →
       components/index.js（内含组件清单，自动按序加载 base/layout/panels/views）
       → 应用启动
  ============================================================ -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <script src="./i18n.js"></script>
  <script src="../assets/js/settings.js"></script>
  <script src="../assets/js/routes.js"></script>
  <!-- 一个文件引入全部共享组件（清单见 components/index.js 的 MANIFEST） -->
  <script src="../components/index.js?v=13"></script>
  <!-- 本项目专属视图（清单见 datamind/views.js，不与其他项目共用） -->
  <script src="./views.js?v=5"></script>

  <!-- ============ 应用启动 ============ -->
  <script>
    (function () {
      'use strict';
      const { createApp, computed, ref } = window.Vue;
      const { createRouter, createWebHashHistory } = window.VueRouter;

      /* 0. 基础配置 */
      const appConfig = {
        system: { logo: '../assets/logo/logo2.png', name: 'UID' },
        layout:{
          layout: 'sideLayout', // sideLayout, topLayout, mixLayout, blankLayout
          header: {
              mode: 'light',// inherit, dark, light, theme-dark
              size: 'medium',// small, medium, large, 48px
              showLogo: false,
              actions: true,
              flexBox: 'tabbar', // breadcrumb, menu, tabbar
          },
          sidebar: {
              mode: 'inherit',// dark, light, inherit
              size: 'medium',// small, medium, large, 48px
              showLogo: true,
              actions: true,
              guide: 'menu', // menu, tabbar
              menu: {
                icons: false,
              }
          },
          pages:{
              breadcrumb: false,
              tabbar: false,
              title: true,
          }
        }
      };

      /* 1. 设置 & i18n */
      const settings = window.Settings.create();
      const state = settings.state;
      const resolvedMode = settings.resolvedMode;
      const dict = computed(() => window.I18N[state.locale] || window.I18N['zh-CN']);
      const t = (key) => key.split('.').reduce((acc, k) => (acc ? acc[k] : ''), dict.value);

      /* 2. 本页菜单 + 路由配置（Hash 模式）
       *    componentKey 对应 views/ 中自注册的视图组件名
       *    所有 path 用绝对路径；有 children 的项自动转为嵌套路由 */
      const menuRoutes = [
        { key: 'home',   path: '/home',         label: 'nav.home',    icon: 'Component',    componentKey: 'HomeView' ,hidden: true},
        { key: 'design',   path: '/design',         label: 'nav.design',    icon: 'Component',    componentKey: 'DesignView' },
        { key: 'principle',  path: '/principle',        label: 'nav.principle',   icon: 'Atom03',   componentKey: 'PrincipleView' },
        {
          key: 'base',
          path: '/base',
          label: 'nav.base',
          icon: 'Bezier01',
          children: [
            { key: 'color', path: '/color', label: 'nav.color', icon: 'BubbleChart', componentKey: 'ColorView' },
            { key: 'font', path: '/font', label: 'nav.font', icon: 'FileText', componentKey: 'FontView' },
            { key: 'grid', path: '/grid', label: 'nav.grid', icon: 'Grid', componentKey: 'GridView' },
            { key: 'size', path: '/size', label: 'nav.size', icon: 'Grid', componentKey: 'SizeView' },
            { key: 'shadow', path: '/shadow', label: 'nav.shadow', icon: 'LayersThreeAlt', componentKey: 'ShadowView' },
          ],
        },
        {
          key: 'normal',
          path: '/normal',
          label: 'nav.normal',
          icon: 'Transform',
          children: [
            { key: 'button', path: '/button', label: 'nav.button', icon: 'Cartificate01', componentKey: 'ButtonView' },
            { key: 'icon', path: '/icon', label: 'nav.icon', icon: 'IrrigationDitch', componentKey: 'IconView' },
            { key: 'divider', path: '/divider', label: 'nav.divider', icon: 'IrrigationDitch', componentKey: 'DividerView' },
            { key: 'space', path: '/space', label: 'nav.space', icon: 'IrrigationDitch', componentKey: 'SpaceView' },
          ],
        },
        {
          key: 'layout',
          path: '/layout',
          label: 'nav.layout',
          icon: 'Crown',
          children: [
            { key: 'flexbox', path: '/flexbox', label: 'nav.flexbox', icon: 'IrrigationDitch', componentKey: 'FlexboxView' },
            { key: 'spliter', path: '/spliter', label: 'nav.spliter', icon: 'IrrigationDitch', componentKey: 'SpliterView' },
            { key: 'waterfall', path: '/waterfall', label: 'nav.waterfall', icon: 'IrrigationDitch', componentKey: 'WaterfallView' },
          ],
        },
        {
          key: 'enter',
          path: '/enter',
          label: 'nav.enter',
          icon: 'Crown',
          children: [
            { key: 'input', path: '/input', label: 'nav.input', icon: 'IrrigationDitch', componentKey: 'InputView' },
            { key: 'select', path: '/select', label: 'nav.select', icon: 'IrrigationDitch', componentKey: 'SelectView' },
            { key: 'dropdown', path: '/dropdown', label: 'nav.dropdown', icon: 'IrrigationDitch', componentKey: 'DropdownView' },
            { key: 'checkbox', path: '/checkbox', label: 'nav.checkbox', icon: 'IrrigationDitch', componentKey: 'CheckboxView' },
            { key: 'radio', path: '/radio', label: 'nav.radio', icon: 'IrrigationDitch', componentKey: 'RadioView' },
            { key: 'switch', path: '/switch', label: 'nav.switch', icon: 'IrrigationDitch', componentKey: 'SwitchView' },
          ],
        },
        {
          key: 'display',
          path: '/display',
          label: 'nav.display',
          icon: 'Crown',
          children: [
            { key: 'card', path: '/card', label: 'nav.card', icon: 'IrrigationDitch', componentKey: 'CardView' },
            { key: 'table', path: '/table', label: 'nav.table', icon: 'IrrigationDitch', componentKey: 'TableView' },
            { key: 'carousel', path: '/carousel', label: 'nav.carousel', icon: 'IrrigationDitch', componentKey: 'CarouselView' },
          ],
        },
        {
          key: 'feedback',
          path: '/feedback',
          label: 'nav.feedback',
          icon: 'Crown',
          children: [
            { key: 'modal', path: '/modal', label: 'nav.modal', icon: 'IrrigationDitch', componentKey: 'ModalView' },
            { key: 'tooltip', path: '/tooltip', label: 'nav.tooltip', icon: 'IrrigationDitch', componentKey: 'TooltipView' },
            { key: 'popover', path: '/popover', label: 'nav.popover', icon: 'IrrigationDitch', componentKey: 'PopoverView' },
            { key: 'message', path: '/message', label: 'nav.message', icon: 'IrrigationDitch', componentKey: 'MessageView' },
            { key: 'notification', path: '/notification', label: 'nav.notification', icon: 'IrrigationDitch', componentKey: 'NotificationView' },
            { key: 'progress', path: '/progress', label: 'nav.progress', icon: 'IrrigationDitch', componentKey: 'ProgressView' },
            { key: 'spinner', path: '/spinner', label: 'nav.spinner', icon: 'IrrigationDitch', componentKey: 'SpinnerView' },
            { key: 'loading', path: '/loading', label: 'nav.loading', icon: 'IrrigationDitch', componentKey: 'LoadingView' },
            { key: 'alert', path: '/alert', label: 'nav.alert', icon: 'IrrigationDitch', componentKey: 'AlertView' },
          ],
        },
        {
          key: 'template',
          path: '/template',
          label: 'nav.template',
          icon: 'Transform',
          children: [
            { key: 'list', path: '/list', label: 'nav.list', icon: 'Cartificate01', componentKey: 'ListView' },
            { key: 'detail', path: '/detail', label: 'nav.detail', icon: 'IrrigationDitch', componentKey: 'DetailView' },
          ],
        },
        {
          key: 'visual',
          path: '/visual',
          label: 'nav.visual',
          icon: 'Crown',
          children: [
            { key: 'lineChart', path: '/lineChart', label: 'nav.lineChart', icon: 'Cartificate01', componentKey: 'LineChartView' },
            { key: 'barChart', path: '/barChart', label: 'nav.barChart', icon: 'Cartificate01', componentKey: 'BarChartView' },
            { key: 'pieChart', path: '/pieChart', label: 'nav.pieChart', icon: 'IrrigationDitch', componentKey: 'PieChartView' },
          ],
        },
      ];
      const router = createRouter({
        history: createWebHashHistory(),
        routes: window.Routes.buildRoutes(menuRoutes),
      });

      /* 3. 创建应用 */
      const app = createApp({
        setup() {
          const collapsed = ref(false);
          const toggleCollapse = () => { collapsed.value = !collapsed.value; };

          return {
            state,
            resolvedMode,
            t,
            enums: settings.enums,
            collapsed,
            toggleCollapse,
            menuItems: menuRoutes,
            // logo: { src: '../assets/logo.svg', name: 'Datamind' },
            appConfig,
          };
        },

        template: `
          <app-layout
            :menu-items="menuItems"
            :collapsed="collapsed"
            @update:collapsed="collapsed = $event"
            :t="t"
            :config="appConfig"
          >
            <template #header-actions>
              <!-- 用户头像 -->
              <x-dropdown placement="bottom-end" trigger="hover" :close-on-click="false">
                <div class="header-user" role="button" aria-label="用户设置">U</div>
                <template #menu>
                  <user-setting :t="t" />
                </template>
              </x-dropdown>
            </template>
          </app-layout>
        `,
      });

      /* 4. 全局注册 + 注入 */
      window.registerComponents(app);
      app.provide('settings', settings);
      app.provide('t', t);
      app.config.globalProperties.t = t; // 给 Breadcrumb 的 $root.t 用

      /* 5. 挂载 */
      app.use(router);
      app.mount('#app');
    })();
  </script>
</body>
</html>
