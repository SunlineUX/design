<!DOCTYPE html>
<html lang="zh-CN" data-theme-color="indigo" data-theme="light" data-density="comfortable" data-radius="medium">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCBS · Dashboard</title>

  <!-- CSS：变量 → 基础 → 组件 → 布局 → 字体图标 -->
  <link rel="stylesheet" href="./assets/css/variables.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/font/iconfont.css" />

  <!-- 防首屏闪烁：Vue 挂载前应用存储的设置 -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('design.settings.v1');
        var s = raw ? JSON.parse(raw) : {};
        var root = document.documentElement;
        if (s.themeColor) root.setAttribute('data-theme-color', s.themeColor);
        if (s.colorMode)  root.setAttribute('data-theme', s.colorMode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : s.colorMode);
        if (s.density)    root.setAttribute('data-density', s.density);
        if (s.radius)     root.setAttribute('data-radius', s.radius);
        if (s.locale)     root.setAttribute('lang', s.locale);
      } catch (e) { /* 忽略 */ }
    })();
  </script>
</head>
<body>
  <!-- Vue 应用根节点 -->
  <div id="app"></div>

  <!-- JS 依赖顺序：Vue → i18n → settings → base → layout → panels → views → 注册入口 → app -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/settings.js"></script>
  <script src="./assets/js/components/base/BaseComponents.js"></script>
  <script src="./assets/js/components/layout/LayoutComponents.js"></script>
  <script src="./assets/js/components/panels/PanelComponents.js"></script>
  <script src="./assets/js/components/views/ViewComponents.js"></script>
  <script src="./assets/js/components/index.js"></script>

  <!-- 应用实例 -->
  <script>
    (function () {
      'use strict';
      const { createApp, computed, ref } = window.Vue;

      const app = createApp({
        setup() {
          /* ========== 1. 设置 & i18n ========== */
          const settings = window.Settings.create();
          const state = settings.state;
          const resolvedMode = settings.resolvedMode;

          /* 取当前语言文案 */
          const dict = computed(() => window.I18N[state.locale] || window.I18N['zh-CN']);
          const t = (key) => key.split('.').reduce((acc, k) => (acc ? acc[k] : ''), dict.value);

          /* ========== 2. 菜单数据（响应 t()） ========== */
          const menuItems = computed(() => [
            { key: 'home',    label: t('nav.home'),    icon: 'home' },
            { key: 'about',   label: t('nav.about'),   icon: 'about' },
            {
              key: 'system',
              label: t('nav.system'),
              icon: 'system',
              children: [
                { key: 'system-users', label: '用户管理', icon: 'user' },
                { key: 'system-roles', label: '角色管理', icon: 'settings' },
              ],
            },
          ]);

          /* ========== 3. 路由（简化版：用 activeKey 切换） ========== */
          const activeKey = ref('home');
          const collapsed = ref(false);
          const breadcrumb = computed(() => {
            const map = {
              home: [{ label: t('nav.home') }],
              about: [{ label: t('nav.about') }],
              system: [{ label: t('nav.system') }],
              'system-users': [{ label: t('nav.system') }, { label: '用户管理' }],
              'system-roles': [{ label: t('nav.system') }, { label: '角色管理' }],
            };
            return map[activeKey.value] || [{ label: t('nav.home') }];
          });

          const toggleCollapse = () => { collapsed.value = !collapsed.value; };

          /* ========== 4. 顶栏右侧语言切换选项 ========== */
          const localeOptions = computed(() => [
            { value: 'zh-CN', label: '简体中文' },
            { value: 'en-US', label: 'EN' },
          ]);

          return {
            state,
            resolvedMode,
            t,
            menuItems,
            activeKey,
            collapsed,
            breadcrumb,
            toggleCollapse,
            localeOptions,
          };
        },

        template: `
          <app-layout
            :menu-items="menuItems"
            :active-key="activeKey"
            @update:active-key="activeKey = $event"
            :breadcrumb="breadcrumb"
            :collapsed="collapsed"
            @update:collapsed="collapsed = $event"
          >
            <template #header-actions>
              <!-- 语言切换 -->
              <div class="segmented" style="margin-right: 4px">
                <button
                  v-for="opt in localeOptions"
                  :key="opt.value"
                  :class="{ active: state.locale === opt.value }"
                  @click="state.locale = opt.value"
                >{{ opt.label }}</button>
              </div>

              <!-- 深浅模式 -->
              <button class="header-action"
                      :title="resolvedMode === 'dark' ? t('settings.options.dark') : t('settings.options.light')"
                      @click="state.colorMode = resolvedMode === 'dark' ? 'light' : 'dark'">
                <icon :name="resolvedMode === 'dark' ? 'moon' : 'sun'" :size="18" />
              </button>

              <!-- 设置按钮 -->
              <button class="header-action" title="Settings">
                <icon name="settings" :size="18" />
              </button>

              <!-- 用户头像 -->
              <div class="header-user">U</div>
            </template>

            <!-- 主内容：按 activeKey 切换视图 -->
            <home-view
              v-if="activeKey === 'home'"
              :settings="state"
              :resolved-mode="resolvedMode"
              :t="t"
              @toggle-sidebar="toggleCollapse"
            />
            <about-view
              v-else-if="activeKey === 'about'"
              :t="t"
            />
            <div v-else class="view-title" style="text-align:center; color: var(--text-tertiary); margin-top: 80px">
              {{ activeKey }} — 页面建设中
            </div>
          </app-layout>
        `,
      });

      /* 注册所有组件 */
      window.registerComponents(app);
      app.mount('#app');
    })();
  </script>
</body>
</html>
